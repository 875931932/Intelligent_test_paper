services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: exam
      POSTGRES_USER: exam
      POSTGRES_PASSWORD: exam
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam -d exam"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["exam_postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["exam_redis_data:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports: ["9000:9000", "9001:9001"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: ["exam_minio_data:/data"]
  api:
    image: python:3.12-slim
    working_dir: /workspace/backend
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--reload"]
    profiles: ["app"]
    volumes: [".:/workspace"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

volumes:
  exam_postgres_data:
  exam_redis_data:
  exam_minio_data:
