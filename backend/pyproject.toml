[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exam-system-backend"
version = "0.1.0"
description = "Core backend bootstrap for the AI exam system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.5",
  "redis>=5.0",
  "celery>=5.4",
  "boto3>=1.35,<1.40.50",
  "httpx>=0.27",
  "langgraph>=1.0",
  "python-docx>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# flat-layout 自动发现会把 backend/ 下的杂散目录（backend/、uploads/ 等测试残留）
# 也当成顶层包，导致 `uv run pytest` 在 editable 构建期报
# "Multiple top-level packages discovered"。显式只打包 app*。
[tool.setuptools.packages.find]
include = ["app*"]
